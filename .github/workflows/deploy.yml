name: Deploy

on:
  push:
    branches:
      - main
      - develop
      - sandbox
      - private

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest, macos-13]

    env:
      TAG: ${{ github.ref == 'refs/heads/main' && 'stable' || github.ref == 'refs/heads/develop' && 'latest' || github.ref == 'refs/heads/sandbox' && 'experimental' || github.ref == 'refs/heads/private' && 'experimental' || 'fail' }}
      BUNDLE_TYPE: ${{ github.ref == 'refs/heads/main' && 'STABLE' || github.ref == 'refs/heads/develop' && 'LATEST' || github.ref == 'refs/heads/sandbox' && 'EXPERIMENTAL' || 'fail' }}

    steps:
    - name: Fail if unsupported branch
      if: env.TAG == 'fail'
      run: |
        echo "This workflow should not run on this branch."
        exit 1

    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        distribution: 'adopt'
        java-version: '21'

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-${{ runner.os }}-

    - name: Build deployment
      run: ./gradlew clean test deployment

    - name: Bundle (Windows)
      if: matrix.os == 'windows-latest'
      shell: powershell
      run: |
        Copy-Item -Path resources/windows/README* -Destination build/jpackage/
        Copy-Item -Path resources/windows/scripts/update.* -Destination build/jpackage/aibtra
        Set-Location -Path build/jpackage
        Get-ChildItem
        "${env:BUNDLE_TYPE}" | Out-File -FilePath aibtra\app\aibtra.bundletype -Encoding ASCII
        $aibtraFullPath = (Resolve-Path "aibtra").Path
        Get-ChildItem -Path aibtra -Recurse -File | ForEach-Object { $_.FullName.Substring($aibtraFullPath.Length + 1) } | Out-File -FilePath "aibtra\update.files" -Encoding UTF8
        7z a -tzip "aibtra-${env:TAG}-windows.zip" *

    - name: Bundle (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        cp resources/linux/scripts/update.* build/jpackage/aibtra
        cd build/jpackage
        ls -al
        echo "${{ env.BUNDLE_TYPE }}" > aibtra/lib/app/aibtra.bundletype
        find aibtra -type f -exec sh -c 'printf "%s\n" "${1#aibtra/}"' _ {} \; > aibtra/update.files
        tar -czf aibtra-${{ env.TAG }}-linux.tar.gz aibtra/*

    - name: Bundle (macOS ARM)
      if: matrix.os == 'macos-latest'
      run: |
        cp -R resources/macos/README* build/jpackage/
        cd build/jpackage
        ls -al
        echo "${{ env.BUNDLE_TYPE }}" > aibtra.app/Contents/app/aibtra.bundletype
        find aibtra.app -type f -exec sh -c 'printf "%s\n" "${1#aibtra.app/}"' _ {} \; > aibtra.app/update.files
        tar -czf aibtra-${{ env.TAG }}-macos-arm.tar.gz *

    - name: Bundle (macOS Intel)
      if: matrix.os == 'macos-13'
      run: |
        cp -R resources/macos/README* build/jpackage/
        cd build/jpackage
        ls -al
        echo "${{ env.BUNDLE_TYPE }}" > aibtra.app/Contents/app/aibtra.bundletype
        find aibtra.app -type f -exec sh -c 'printf "%s\n" "${1#aibtra.app/}"' _ {} \; > aibtra.app/update.files
        tar -czf aibtra-${{ env.TAG }}-macos-intel.tar.gz *

    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: binaries
        path: build/jpackage/aibtra-${{ env.TAG }}-*

  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/sandbox'

    env:
      TAG: ${{ github.ref == 'refs/heads/main' && 'stable' || github.ref == 'refs/heads/develop' && 'latest' || github.ref == 'refs/heads/sandbox' && 'experimental' || 'fail' }}
      RELEASE_TITLE: ${{ github.ref == 'refs/heads/main' && 'Stable release' || github.ref == 'refs/heads/develop' && 'Latest Build' || github.ref == 'refs/heads/sandbox' && 'Experimental Build' || 'fail' }}

    steps:
    - name: Fail if unsupported branch
      if: env.TAG == 'fail'
      run: |
        echo "This workflow should not run on this branch."
        exit 1

    - name: Download artifacts
      uses: actions/download-artifact@v3

    - name: Determine release tag
      id: determine-tag
      run: |
        echo "tag=${{ env.TAG }}" >> $GITHUB_ENV

    - name: Upload release
      uses: "marvinpinto/action-automatic-releases@latest"
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: "${{ env.tag }}"
        prerelease: ${{ github.ref != 'refs/heads/main' }}
        title: "${{ env.RELEASE_TITLE }}"
        files: |
          binaries/*

    - name: Checkout code
      uses: actions/checkout@v3

    - name: Create updates.json
      run: |
        git fetch origin main develop sandbox
        mkdir _site
        echo "{ \"stable\": \"$(git rev-parse origin/main)\", \"latest\": \"$(git rev-parse origin/develop)\", \"experimental\": \"$(git rev-parse origin/sandbox)\" }" > _site/updates.json

    - name: Publish updates.json
      uses: cloudflare/pages-action@v1
      with:
        apiToken: ${{ secrets.CLOUDFLARE_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT }}
        projectName: aibtra-updates
        directory: ./_site
        branch: main

